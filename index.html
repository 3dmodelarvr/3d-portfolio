<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavel Gorbachev | Senior 3D Artist</title>
  
  <!-- Подключаем библиотеку model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* Переменные для светлой и темной темы */
    :root {
      --bg-color: #f4f6f7;
      --text-color: #2c3e50;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.5);
    }
    
    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #ecf0f1;
      --panel-bg: rgba(40, 40, 40, 0.75);
      --panel-border: rgba(80, 80, 80, 0.4);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; /* Убираем любые скроллбары */
      transition: background-color 0.4s ease;
      /* ЗАЩИТА: Запрещаем выделение текста */
      user-select: none; 
      -webkit-user-select: none;
    }

    /* Шапка сайта */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      z-index: 20; /* Чтобы шапка всегда была поверх */
    }
    .logo { font-weight: bold; font-size: 20px; letter-spacing: 1px; }
    .logo span { color: #009688; font-weight: normal; font-size: 16px; margin-left: 10px; }
    
    #themeToggle {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--text-color);
      background: transparent;
      color: var(--text-color);
      font-size: 14px;
      transition: 0.3s;
    }
    #themeToggle:hover { opacity: 0.7; }

    /* Основной контейнер растянут на всю страницу */
    main {
      position: relative;
      flex: 1;
      width: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Плавающие кнопки перелистывания */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: var(--panel-bg);
      color: var(--text-color);
      border: 1px solid var(--panel-border);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .nav-btn:hover { background: #009688; color: white; border-color: #009688; }
    
    .nav-btn.prev { left: 40px; }
    .nav-btn.next { right: 40px; }

    /* Стеклянная информационная панель */
    .info-panel {
      position: absolute;
      bottom: 40px;
      left: 40px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 20px 25px;
      border-radius: 12px;
      min-width: 220px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      pointer-events: none;
    }
    .info-panel h3 { margin: 0 0 12px 0; font-size: 18px; color: #009688; }
    .info-panel p { margin: 6px 0; font-size: 14px; font-weight: bold; }
    .info-panel span { font-weight: normal; opacity: 0.9; }

    /* Анимированный лоадер */
    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      background-color: transparent;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0, 150, 136, 0.2);
      border-left-color: #009688;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

  </style>
</head>

<body oncontextmenu="return false;">

  <header>
    <div class="logo">PAVEL GORBACHEV <span>| SENIOR 3D ARTIST</span></div>
    <button id="themeToggle">🌙 Dark Mode</button>
  </header>

  <main>
    <!-- Кнопка Влево -->
    <button class="nav-btn prev" onclick="prevModel()">❮</button>
    
    <!-- model-viewer растянут на весь main -->
    <model-viewer id="myViewer" shadow-intensity="1.2" shadow-softness="1" camera-controls auto-rotate ar>
      <div slot="poster" class="loader-container">
         <div class="spinner"></div>
      </div>
    </model-viewer>
    
    <!-- Информационная панель -->
    <div class="info-panel">
      <h3 id="infoName">Loading...</h3>
      <p>Size: <span id="infoSize">--</span></p>
      <p>Polygons: <span id="infoPoly">--</span></p>
      <p>Textures: <span id="infoTex">--</span></p>
    </div>

    <!-- Кнопка Вправо -->
    <button class="nav-btn next" onclick="nextModel()">❯</button>
  </main>

  <script>
    const models = [
      { file: '1.glb', name: 'Yeti Roadie 48 Cooler', size: '1.7 MB', poly: '~45k', tex: '4K PBR' },
      { file: '2.glb', name: 'Natural Rattan Round Table', size: '2.3 MB', poly: '~60k', tex: '4K PBR' },
      { file: '3.glb', name: 'Bamboo Folding Shelf', size: '3.2 MB', poly: '~80k', tex: '4K PBR' },
      { file: '4.glb', name: 'Carlota Dark Blue Chair', size: '3.1 MB', poly: '~75k', tex: '4K PBR' },
      { file: '5.glb', name: 'Black Diamond Synthetic Chair', size: '2.4 MB', poly: '~65k', tex: '4K PBR' },
      { file: '6.glb', name: 'Petunia Black/Beige Chair', size: '4.1 MB', poly: '~110k', tex: '4K PBR' },
      { file: '7.glb', name: 'Aurora Multicolor Chair', size: '2.3 MB', poly: '~55k', tex: '4K PBR' }
    ];

    let currentIndex = 0;
    const viewer = document.getElementById('myViewer');
    let currentObjectURL = null;

    async function loadModel(index) {
      const data = models[index];
      
      document.getElementById('infoName').innerText = data.name;
      document.getElementById('infoSize').innerText = data.size;
      document.getElementById('infoPoly').innerText = data.poly;
      document.getElementById('infoTex').innerText = data.tex;

      try {
        viewer.removeAttribute('src'); 
        
        const response = await fetch(data.file);
        const blob = await response.blob();
        
        if (currentObjectURL) {
          URL.revokeObjectURL(currentObjectURL);
        }
        
        currentObjectURL = URL.createObjectURL(blob);
        viewer.setAttribute('src', currentObjectURL);

      } catch (error) {
        console.error("Error loading model:", error);
      }
    }

    function nextModel() {
      currentIndex = (currentIndex + 1) % models.length;
      loadModel(currentIndex);
    }

    function prevModel() {
      currentIndex = (currentIndex - 1 + models.length) % models.length;
      loadModel(currentIndex);
    }

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeToggle.innerText = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    });

    loadModel(currentIndex);
  </script>
</body>
</html>
